# Builds the site and publishes it to https://toowl.my.id/.
# The --base flag makes asset URLs resolve at the domain root (custom domain toowl.my.id); local
# `npm run build` keeps the default base.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc -b first: the type-check is the correctness gate.
      # seo.mjs writes a real page per tool and language, plus sitemap.xml.
      - run: npx tsc -b && npx vite build --base=/ && node scripts/seo.mjs --base=/

      # The CodeCanyon live preview of the developer kits (no store links), at /kit-preview/.
      - run: node packages/_kits/build.mjs --preview=dist/kit-preview
      # Live demos of the site templates sold on Codester, at /templates/<name>/.
      - run: node packages/_templates/build.mjs masjid --demo=dist/templates/masjid
      - run: node packages/_templates/build.mjs church --demo=dist/templates/church

      # include-hidden-files: ships public/.well-known/assetlinks.json, which the
      # Play Store app (TWA) needs to open without a browser address bar.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5

      # Tell Bing & co. (IndexNow) about every page once the new site is live.
      - run: node scripts/indexnow.mjs
        continue-on-error: true

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timetable</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <style>html:not([data-design]) body { visibility: hidden }</style>
  <script>
    // ES modules don't load from file://. Explain instead of showing a blank page.
    if (location.protocol === 'file:') addEventListener('DOMContentLoaded', () => {
      document.documentElement.dataset.design = 'calm'
      document.body.insertAdjacentHTML('afterbegin', '<div style="position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:24px;background:#f5f3ee;color:#141815;font:16px/1.6 system-ui,sans-serif;text-align:center"><div style="max-width:560px"><h2 style="margin:0 0 12px">Open this page from a web server</h2><p>Browsers block the scripts of a page opened straight from a folder. Upload the files to your hosting, or run a local server in this folder (see documentation/index.html → Quick start).</p></div></div>')
    })
  </script>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-in">
      <a class="brand" href="index.html"><img src="assets/img/logo.svg" alt="" width="26" height="26" /><span id="brand-name"></span></a>
      <a class="link back" href="index.html" data-t="Home|Beranda"></a>
    </div>
  </header>
  <main class="wrap sheet">
    <div class="sheet-head">
      <div>
        <p class="dates"><span data-t="Prayer timetable|Jadwal sholat"></span><span id="hijri-range"></span></p>
        <h1 id="month"></h1>
      </div>
      <div class="month-nav">
        <button class="sq" id="prev" aria-label="Previous month">←</button>
        <button class="sq" id="next" aria-label="Next month">→</button>
        <button class="sq wide" id="today" data-t="This month|Bulan ini"></button>
        <button class="btn btn-small" id="print" data-t="Print|Cetak"></button>
      </div>
    </div>
    <div class="month-scroll">
      <table class="month">
        <thead><tr id="cols"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note" id="method-note"></p>
  </main>
  <script type="module" src="assets/js/timetable.js"></script>
</body>
</html>

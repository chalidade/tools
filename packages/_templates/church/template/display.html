<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Display</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>html:not([data-design]) body { visibility: hidden }</style>
  <script>
    // ES modules don't load from file://. Explain instead of showing a blank page.
    if (location.protocol === 'file:') addEventListener('DOMContentLoaded', () => {
      document.documentElement.dataset.design = 'calm'
      document.body.insertAdjacentHTML('afterbegin', '<div style="position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:24px;background:#f5f3ee;color:#141815;font:16px/1.6 system-ui,sans-serif;text-align:center"><div style="max-width:560px"><h2 style="margin:0 0 12px">Open this page from a web server</h2><p>Browsers block the scripts of a page opened straight from a folder. Upload the files to your hosting, or run a local server in this folder (see documentation/index.html → Quick start).</p></div></div>')
    })
  </script>
</head>
<body>
  <div class="screen" id="screen">
    <header class="top">
      <div class="id">
        <img src="assets/img/logo.svg" alt="" />
        <h1 id="name"></h1>
      </div>
      <p class="dates"><span id="date"></span><span class="mini" id="mini"></span></p>
    </header>

    <div class="body">
      <div class="stage">
        <section class="normal" id="normal">
          <p class="hm" id="clock"></p>
          <p class="upnext"><span class="lbl" id="next-label"></span><span id="next-name"></span> <span class="in" id="next-in"></span></p>
          <article class="slide" id="slide"><p class="quote" id="quote"></p><p class="source" id="source"></p></article>
        </section>

        <section class="full" id="countdown" hidden>
          <p class="label" data-t="The service begins in|Ibadah dimulai dalam"></p>
          <p class="count" id="count"></p>
          <p class="sub"><span id="count-name"></span> · <span data-t="Please find a seat and silence your phone|Silakan duduk dan matikan nada HP"></span></p>
        </section>

        <section class="full" id="live" hidden>
          <p class="label" id="live-label"></p>
          <p class="big" data-t="Welcome|Selamat datang"></p>
          <p class="sub" id="live-sub"></p>
        </section>
      </div>

      <section class="times" id="times"></section>
    </div>

    <footer class="ticker"><div class="track" id="ticker"></div></footer>
  </div>
  <button class="fs" id="fs" data-t="Full screen|Layar penuh"></button>
  <script type="module" src="assets/js/display.js"></script>
</body>
</html>

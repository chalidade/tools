*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#09090a;color:#ededee;font-family:Geist,sans-serif;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(#ffffff1c 1.5px,transparent 1.5px);background-size:28px 28px;mask-image:radial-gradient(900px 520px at 78% 50%,#000,transparent 75%)}
.c{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;width:640px}
.logo{width:120px;fill:#ededee}

.foot b{color:#ededee;font-weight:500}
.foot i{width:10px;height:10px;border-radius:50%;background:#c6ff3a}
/* right: the command palette */
.card{position:absolute;right:72px;top:112px;width:440px;border:1px solid #ffffff1f;background:#171718;border-radius:24px;overflow:hidden;box-shadow:0 40px 90px #000a}
.in{display:flex;align-items:center;gap:14px;padding:22px 24px;font-size:24px;border-bottom:1px solid #ffffff17}
.in u{width:3px;height:28px;background:#c6ff3a;margin-left:-8px}
.in kbd{margin-left:auto;font:500 15px "Geist Mono",monospace;color:#8e8e93;border:1px solid #ffffff26;border-radius:8px;padding:4px 9px}
.in svg{width:24px;height:24px;stroke:#8e8e93;fill:none;stroke-width:2;stroke-linecap:round}
.lbl{font:500 13px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#8e8e93;padding:18px 24px 8px}
.r{display:flex;align-items:center;gap:16px;margin:0 10px;padding:12px 14px;border-radius:14px;font-size:21px;font-weight:500}
.r em{font-style:normal;color:#c6ff3a}
.r b{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff17;background:#09090a;flex:none}
.r small{margin-left:auto;font:14px "Geist Mono",monospace;color:#8e8e93}
.r.on{background:#c6ff3a12;box-shadow:inset 0 0 0 1px #c6ff3a33}
.r.on b{background:#c6ff3a;border-color:#c6ff3a}
.end{height:14px}
